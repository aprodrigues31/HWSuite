name: Test build (pre-release)

# Publishes the files of a CI run as a pre-release, so a test build can be downloaded from the Releases page
# with a plain link. Pre-releases are never offered by the app's update check (it only reads the latest release).
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: CI run id whose files to publish
        required: true

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download the CI files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ inputs.run_id }}" -R "${{ github.repository }}" -D files -p 'hwsuite-setup-*' -p 'hwsuite-gui-*'
          find files -type f -exec ls -la {} \;

      - name: Create the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          setup=$(find files -name 'hwsuite-setup-*.exe' | head -1)
          gui=$(find files -name 'HWSuite.Gui.exe' | head -1)
          label=$(basename "$setup" .exe | sed 's/^hwsuite-setup-//')
          mkdir out
          cp "$setup" out/
          (cd "$(dirname "$gui")" && zip -9 "$OLDPWD/out/hwsuite-gui-${label}-win-x64.zip" HWSuite.Gui.exe)
          sha=$(gh run view "${{ inputs.run_id }}" -R "${{ github.repository }}" --json headSha -q .headSha)
          gh release create "test-${label}" out/* -R "${{ github.repository }}" --prerelease --target "$sha" \
            --title "Build de teste ${label}" \
            --notes "Build de teste (pré-release) gerada pelo CI, execução ${{ inputs.run_id }}. Não é oferecida pela atualização automática."
