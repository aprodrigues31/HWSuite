name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Picked up by MSBuild as $(BuildNumber): stamped into the file version and --version.
  BuildNumber: ${{ github.run_number }}

jobs:
  build-test:
    name: Build, test and sample report (Windows)
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      label: ${{ steps.version.outputs.label }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Version
        id: version
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $version = @($props.Project.PropertyGroup.VersionPrefix | Where-Object { $_ })[0]
          $label = "$version-build.$env:BuildNumber"
          "version=$version" >> $env:GITHUB_OUTPUT
          "label=$label" >> $env:GITHUB_OUTPUT
          "## HWSuite $label (commit $("$env:GITHUB_SHA".Substring(0, 7)))" >> $env:GITHUB_STEP_SUMMARY
          Write-Host "HWSuite $label"

      - name: Restore
        run: dotnet restore HWSuite.slnx

      - name: Build
        run: dotnet build HWSuite.slnx -c Release --no-restore

      - name: Test
        run: dotnet test HWSuite.slnx -c Release --no-build --logger "trx;LogFileName=results.trx" --results-directory artifacts/test-results

      - name: Sample reports on the runner
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/reports | Out-Null
          foreach ($format in 'txt', 'html', 'json') {
            dotnet run --project src/HWSuite.Cli -c Release --no-build -- report --format $format --out "artifacts/reports/runner.$format" --redact --lang pt-BR
            # 3 = report written but a provider failed; shown in the report diagnostics, not a CI failure.
            if ($LASTEXITCODE -notin 0, 3) { exit $LASTEXITCODE }
          }
          Get-Content artifacts/reports/runner.txt
          # Also show the text report on the run page (job summary).
          "### Relatório de exemplo (runner Windows)`n" + '```text' | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          Get-Content artifacts/reports/runner.txt | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          '```' | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          exit 0

      - name: Sensors smoke test on the runner
        shell: pwsh
        run: |
          dotnet run --project src/HWSuite.Cli -c Release --no-build -- sensors --lang pt-BR | Tee-Object artifacts/reports/sensors.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project src/HWSuite.Cli -c Release --no-build -- sensors --log artifacts/reports/sensors.csv --interval 1 --duration 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $rows = (Get-Content artifacts/reports/sensors.csv).Count
          Write-Host "CSV lines: $rows"
          if ($rows -lt 3) { throw "Sensor log has too few rows ($rows)" }
          "### Sensores no runner`n" + '```text' | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          Get-Content artifacts/reports/sensors.txt | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          '```' | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

      - name: Processor benchmark on the runner
        shell: pwsh
        run: |
          # A real measurement for the reference table (runner CPUs are cloud vCPUs, labelled as such).
          dotnet run --project src/HWSuite.Cli -c Release --no-build -- bench --duration 5 --lang pt-BR | Tee-Object artifacts/reports/bench.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "$([Environment]::GetFolderPath('MyDocuments'))\HWSuite\benchmark.csv" artifacts/reports/benchmark.csv
          "### Benchmark do processador no runner`n" + '```text' | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          Get-Content artifacts/reports/bench.txt | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          '```' | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

      - name: PawnIO installer signature (official download)
        shell: pwsh
        run: |
          $file = Join-Path $env:RUNNER_TEMP 'PawnIO_setup.exe'
          Invoke-WebRequest -Uri 'https://github.com/namazso/PawnIO.Setup/releases/latest/download/PawnIO_setup.exe' -OutFile $file
          $sig = Get-AuthenticodeSignature -LiteralPath $file
          Write-Host "Status: $($sig.Status)"
          Write-Host "Signer: $($sig.SignerCertificate.Subject)"
          "### Assinatura do instalador PawnIO`n- Status: $($sig.Status)`n- Assinante: $($sig.SignerCertificate.Subject)" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

      - name: Driver install / status / uninstall on the runner
        continue-on-error: true
        shell: pwsh
        run: |
          $cli = { dotnet run --project src/HWSuite.Cli -c Release --no-build -- @args }
          $log = New-Object System.Collections.Generic.List[string]
          foreach ($step in @(@('driver','status'), @('driver','install','--yes'), @('driver','status'), @('sensors'), @('driver','uninstall','--yes'), @('driver','status'))) {
            $log.Add("> hwsuite $($step -join ' ')")
            $out = & $cli @step 2>&1 | Out-String
            $log.Add($out.TrimEnd())
            $log.Add("(exit $LASTEXITCODE)")
          }
          $text = $log -join "`n"
          Write-Host $text
          "### Ciclo do driver no runner`n" + '```text' + "`n$text`n" + '```' | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

      - name: Publish single-file executable (win-x64)
        run: dotnet publish src/HWSuite.Cli -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/publish

      - name: Check the published version
        shell: pwsh
        run: |
          $out = & artifacts/publish/hwsuite.exe --version
          Write-Host $out
          if ($out -notlike "hwsuite ${{ steps.version.outputs.version }} (build $env:BuildNumber*") { throw "Unexpected version: $out" }
          (Get-Item artifacts/publish/hwsuite.exe).VersionInfo | Format-List FileVersion, ProductVersion

      - name: Desktop app (WinUI 3) - publish
        run: dotnet publish src/HWSuite.Gui -c Release -r win-x64 -p:Platform=x64 -o artifacts/gui

      - name: Desktop app - startup smoke test
        shell: pwsh
        run: |
          $exe = Resolve-Path artifacts/gui/HWSuite.Gui.exe
          $started = Get-Date
          $notes = New-Object System.Collections.Generic.List[string]
          function Fail($why) {
            Write-Host $why
            Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = $started } -ErrorAction SilentlyContinue |
              Where-Object { $_.Message -match 'HWSuite' } | Select-Object -First 5 | Format-List TimeCreated, ProviderName, Message
            Get-Process HWSuite.Gui -ErrorAction SilentlyContinue | Stop-Process -Force
            exit 1
          }

          # 0. Sensors reach the window: runs 12 s with the window open and reports what happened.
          #    The runner renders WinUI in software and sometimes stalls the UI thread inside native
          #    code; a stall is diagnosed (managed + native stacks) and retried once, with a warning.
          function Get-Stacks($processId, $name) {
            New-Item -ItemType Directory -Force artifacts/reports | Out-Null
            $dump = Join-Path $env:RUNNER_TEMP "$name.dmp"
            $managed = '(no managed stacks)'; $native = '(no native stacks)'
            try {
              dotnet tool install --global dotnet-dump 2>$null | Out-Null
              $dumpTool = Join-Path $env:USERPROFILE '.dotnet\tools\dotnet-dump.exe'
              & $dumpTool collect -p $processId -o $dump --type Full | Out-Null
              $managed = (& $dumpTool analyze $dump -c 'clrstack -all' -c 'exit' 2>&1 | Out-String)
            } catch { $managed = "dotnet-dump failed: $_" }
            $cdb = @("${env:ProgramFiles(x86)}\Windows Kits\10\Debuggers\x64\cdb.exe", "$env:ProgramFiles\Windows Kits\10\Debuggers\x64\cdb.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
            if ($cdb -and (Test-Path $dump)) {
              $native = (& $cdb -z $dump -c '.symfix; .reload; ~0k 40; ~*k 12; q' 2>&1 | Out-String)
            } elseif (-not $cdb) { $native = '(cdb.exe not found on the runner)' }
            $managed | Out-File -Encoding utf8 "artifacts/reports/$name-managed.txt"
            $native | Out-File -Encoding utf8 "artifacts/reports/$name-native.txt"
            return $native
          }

          $report = Join-Path $env:RUNNER_TEMP 'gui-self-test.txt'
          $passed = $false
          foreach ($attempt in 1, 2) {
            Remove-Item $report -ErrorAction SilentlyContinue
            $test = Start-Process -FilePath $exe -ArgumentList '--self-test', "`"$report`"" -PassThru
            $finished = $test.WaitForExit(60000)
            $text = if (Test-Path $report) { Get-Content $report -Raw } else { '(no report)' }
            Write-Host "Attempt $attempt`n$text"
            if ($finished) {
              "### Autoteste do aplicativo (tentativa $attempt)`n" + '```text' + "`n$text`n" + '```' | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
              if ($test.ExitCode -ne 0) { Fail "Self-test failed (exit $($test.ExitCode))" }
              $passed = $true
              break
            }

            $native = Get-Stacks $test.Id "gui-hang-$attempt"
            $test.Kill()
            $mainThread = ($native -split "`n" | Select-Object -First 70) -join "`n"
            "### Autoteste do aplicativo travou (tentativa $attempt)`n" + '```text' + "`n$text`n" + '```' + "`n#### Pilha nativa da thread de interface`n" + '```text' + "`n$mainThread`n" + '```' | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
            $sensorsOk = $text -match 'error: none' -and $text -notmatch 'updates: 0\b'
            if (-not $sensorsOk) { Fail "Self-test did not finish and the sensors were not healthy" }
            Write-Host "::warning title=Interface travou no runner::A thread de interface do WinUI parou na tentativa $attempt com os sensores funcionando; pilhas em artifacts/reports/gui-hang-$attempt-*.txt"
          }
          if (-not $passed) { Fail "Self-test hung twice" }

          # 1. Starts minimized (as the logon task does) and keeps running.
          $app = Start-Process -FilePath $exe -ArgumentList '--minimized' -PassThru
          Start-Sleep -Seconds 20
          if ($app.HasExited) { Fail "HWSuite.Gui exited early with code $($app.ExitCode)" }
          $app.Refresh()
          $notes.Add("Iniciou com --minimized e continuou rodando por 20 s (memória $([math]::Round($app.WorkingSet64 / 1MB)) MB)")
          $notes.Add("Janela visível ao iniciar minimizado: $(if ($app.MainWindowHandle -ne 0) { 'sim (sem área de notificação no runner)' } else { 'não (ficou na bandeja)' })")

          # 2. A second launch hands over to the running copy and exits.
          $second = Start-Process -FilePath $exe -PassThru
          if (-not $second.WaitForExit(15000)) { $second.Kill(); Fail "Second instance did not exit" }
          $notes.Add("Segunda instância encerrou e sinalizou a primeira (código $($second.ExitCode))")
          Start-Sleep -Seconds 3
          $app.Refresh()
          if ($app.HasExited) { Fail "First instance exited after the second launch" }
          $notes.Add("Janela visível após o sinal: $(if ($app.MainWindowHandle -ne 0) { 'sim' } else { 'não' })")

          Stop-Process -Id $app.Id -Force
          $notes | ForEach-Object { Write-Host $_ }
          "### Aplicativo (WinUI 3)`n" + (($notes | ForEach-Object { "- $_" }) -join "`n") | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

      - name: Desktop app - package
        shell: pwsh
        run: Compress-Archive -Path artifacts/gui/* -DestinationPath "artifacts/hwsuite-gui-${{ steps.version.outputs.label }}-win-x64.zip"

      - name: Installer - build and install/uninstall check
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress | Out-Null
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=${{ steps.version.outputs.label }}" "/DGuiDir=$PWD\artifacts\gui" "/DCliExe=$PWD\artifacts\publish\hwsuite.exe" "/O$PWD\artifacts" installer/hwsuite.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }
          $setup = "artifacts/hwsuite-setup-${{ steps.version.outputs.label }}.exe"
          Start-Process -FilePath (Resolve-Path $setup) -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          $installed = "$env:LOCALAPPDATA\Programs\HWSuite"
          if (-not (Test-Path "$installed\HWSuite.Gui.exe") -or -not (Test-Path "$installed\hwsuite.exe")) { throw "Installer did not install the app" }
          & "$installed\hwsuite.exe" --version
          Start-Process -FilePath "$installed\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES' -Wait
          Start-Sleep -Seconds 3
          if (Test-Path "$installed\HWSuite.Gui.exe") { throw "Uninstaller left the app behind" }
          Write-Host "Installer OK: $((Get-Item $setup).Length / 1MB) MB"

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: hwsuite-setup-${{ steps.version.outputs.label }}
          path: artifacts/hwsuite-setup-${{ steps.version.outputs.label }}.exe
          if-no-files-found: warn

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: hwsuite-gui-${{ steps.version.outputs.label }}-win-x64
          path: artifacts/hwsuite-gui-${{ steps.version.outputs.label }}-win-x64.zip
          if-no-files-found: warn

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: hwsuite-${{ steps.version.outputs.label }}-win-x64
          path: |
            artifacts/publish/hwsuite.exe
            artifacts/reports/
            artifacts/test-results/
          if-no-files-found: warn

