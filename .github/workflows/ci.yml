name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Build, test and sample report (Windows)
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore HWSuite.slnx

      - name: Build
        run: dotnet build HWSuite.slnx -c Release --no-restore

      - name: Test
        run: dotnet test HWSuite.slnx -c Release --no-build --logger "trx;LogFileName=results.trx" --results-directory artifacts/test-results

      - name: Sample reports on the runner
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/reports | Out-Null
          foreach ($format in 'txt', 'html', 'json') {
            dotnet run --project src/HWSuite.Cli -c Release --no-build -- report --format $format --out "artifacts/reports/runner.$format" --redact --lang pt-BR
            # 3 = report written but a provider failed; shown in the report diagnostics, not a CI failure.
            if ($LASTEXITCODE -notin 0, 3) { exit $LASTEXITCODE }
          }
          Get-Content artifacts/reports/runner.txt
          # Also show the text report on the run page (job summary).
          "## Relatório de exemplo (runner Windows)`n" + '```text' | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          Get-Content artifacts/reports/runner.txt | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          '```' | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          exit 0

      - name: Publish single-file executable (win-x64)
        run: dotnet publish src/HWSuite.Cli -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/publish

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: hwsuite-win-x64
          path: |
            artifacts/publish/hwsuite.exe
            artifacts/reports/
            artifacts/test-results/
          if-no-files-found: warn
